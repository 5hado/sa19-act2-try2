# config/database.yml

# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: board_game_library_development

test:
  <<: *default
  database: board_game_library_test

production:
  primary: &primary_production
    <<: *default
    database: board_game_library_production
    username: board_game_library
    password: <%= ENV["BOARD_GAME_LIBRARY_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: board_game_library_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: board_game_library_production_queue
    migrations_paths: db/queue_migrate
  # cable:  # Disabled cables section
  #   <<: *primary_production
  #   database: board_game_library_production_cable
  #   migrations_paths: db/cable_migrate

# production:
#   <<: *default
#   database: myapp_production
#   cable:
#     adapter: redis
#     url: redis://localhost:6379/1
#     channel_prefix: myapp_production

production:
  url: <%= ENV["MY_APP_DATABASE_URL"] %>
